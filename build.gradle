plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'soapclient'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    jaxb
}

dependencies {
    // Spring Web Services start는 서버와 클라이언트 지원을 모두 가져온다. REST 컨트롤러를 제공하므로 webmvc도 사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-webservices'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.glassfish.jaxb:jaxb-runtime'

    testImplementation 'org.springframework.boot:spring-boot-starter-webservices-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    jaxb 'org.glassfish.jaxb:jaxb-xjc'
}

// ---------------------------------------------------------------
// WSDL → Java 생성
// ---------------------------------------------------------------
def wsdlSpecs = [
        [
                name: 'Calculator',
                url: 'http://www.dneonline.com/calculator.asmx?WSDL',
                dir: 'calculator',
                file: 'calculator.wsdl',
                pkg: 'com.example.sample.calculator.wsdl'
        ],
        [
                name: 'CountryInfo',
                url: 'http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso?WSDL',
                dir: 'countryInfo',
                file: 'CountryInfoService.wsdl',
                pkg: 'com.example.sample.countryinfo.wsdl'
        ],
]

def wsdlRoot = file('src/main/resources/wsdl')
def jaxbRoot = layout.buildDirectory.dir('generated/sources/jaxb')

def genTasks = wsdlSpecs.collect { spec ->
    def wsdlDir = new File(wsdlRoot, spec.dir)
    def wsdlFile = new File(wsdlDir, spec.file)
    def outDir = jaxbRoot.map { it.dir(spec.name) }

    // 1) WSDL이 로컬에 없을 때만 내려받기
    def download = tasks.register("downloadWsdl${spec.name}") {
        group = 'jaxb'
        description = "${spec.url} -> ${wsdlFile}"
        outputs.file(wsdlFile)
        onlyIf { !wsdlFile.exists() }
        doLast {
            wsdlDir.mkdirs()
            ant.get(src: spec.url, dest: wsdlFile, skipexisting: true)
        }
    }

    // 2) 로컬 WSDL로 JAXB 클래스 생성
    tasks.register("genJaxb${spec.name}", JavaExec) {
        group = 'jaxb'
        description = "${spec.file} -> ${spec.pkg}"
        dependsOn download
        inputs.dir(wsdlDir)
        outputs.dir(outDir)
        classpath = configurations.jaxb
        mainClass = 'com.sun.tools.xjc.XJCFacade'
        args    '-wsdl',
                '-encoding', 'UTF-8',
                '-p', spec.pkg,
                '-d', outDir.get().asFile.path,
                wsdlFile.path
        doFirst {
            outDir.get().asFile.mkdirs()
        }
    }
}

tasks.register('genJaxb') {
    group = 'jaxb'
    description = '모든 WSDL에서 JAXB 클래스 생성'
    dependsOn genTasks
}

sourceSets {
    main {
        java {
            srcDirs(genTasks)
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
